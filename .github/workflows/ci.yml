# Builds Retrocore and runs every test that needs nothing outside the repository: the .NET tests (those that need
# ROM dumps, disk images or other external files report inconclusive), the debug adapter scripts, and the
# extension's grammar and unit tests. A second job runs the extension's editor tests in a pinned VS Code, which
# they download, under xvfb, against the Release debug host, which also runs the language servers.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      # An empty cache folder, so no test finds external files on the runner by accident.
      RETROCORE_CACHE: ${{ github.workspace }}/cache
    defaults:
      run:
        working-directory: Retrocore
    steps:
      - name: Check out Retrocore
        uses: actions/checkout@v7
        with:
          path: Retrocore

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: Retrocore/global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Retrocore/extension/package-lock.json

      - name: Build
        run: dotnet build Retrocore.slnx -c Release

      - name: Test
        run: dotnet test Retrocore.slnx -c Release --no-build --logger trx --results-directory "${{ github.workspace }}/test-results"

      - name: Assemble the IIe sample
        run: |
          mkdir -p artifacts/iie-sample
          dotnet artifacts/AnyCPU/Release/Retrocore.Debug/net11.0/Retrocore.Debug.dll --assemble sample/iie/main.s artifacts/iie-sample/main.bin --dialect ca65 --config sample/iie/link.cfg

      # The project builds the engine for its five bare targets, the game linked in, after its steps pack both games
      # with the packer; then the reference engine plays each game's transcripts as their .out files show them.
      - name: Build the adventure sample and play its transcripts
        working-directory: Retrocore/sample/adventure
        run: |
          dotnet ../../artifacts/AnyCPU/Release/Retrocore.Debug/net11.0/Retrocore.Debug.dll build --all
          for transcript in test-win test-fall test-drown; do
            dotnet run tools/packer.cs -- play obj/test.bin "games/$transcript.in" --echo --expect "games/$transcript.out"
          done
          for transcript in pirate-win pirate-die; do
            dotnet run tools/packer.cs -- play obj/pirate.bin "games/$transcript.in" --echo --expect "games/$transcript.out"
          done

      - name: Debug adapter tests
        run: |
          node tools/Test-Trs80Dap.mjs
          node tools/Test-Trs80Model3Dap.mjs
          node tools/Test-Apple1Dap.mjs
          node tools/Test-Apple1BasicDap.mjs
          node tools/Test-PetDap.mjs
          node tools/Test-PetBasicDap.mjs
          node tools/Test-IntegerBasicDap.mjs
          node tools/Test-Breakpoints.mjs
          node tools/Test-Memory.mjs
          node tools/Test-IIeDap.mjs
          node tools/Test-IIPlusDap.mjs
          node tools/Test-Apple3Dap.mjs
          node tools/Test-BlockMediaDap.mjs
          node tools/Test-SoftCardDap.mjs
          node tools/Test-SoftCard3Dap.mjs
          node tools/Test-BusinessBasicDap.mjs
          node tools/Test-CocoDap.mjs
          node tools/Test-BbcDap.mjs
          node tools/Test-AltairDap.mjs
          node tools/Test-AtariDap.mjs
          node tools/Test-AdventureDap.mjs
          node tools/Test-ProjectDap.mjs
          node tools/Test-OffMachine.mjs

      # The host packed as the .NET tool retrocore, installed from that package alone into a local folder (it is
      # published nowhere, and no other source may supply a package of its name), builds and debugs the project sample
      # as the host itself does.
      - name: The retrocore tool
        run: |
          rm -rf artifacts/tool-package artifacts/tool
          dotnet pack src/Retrocore.Debug/Retrocore.Debug.csproj -c Release --no-build -o artifacts/tool-package
          unzip -l artifacts/tool-package/retrocore.0.1.0-dev.nupkg | grep -qF tools/net11.0/any/Schemas/project-1.schema.json
          printf '<configuration>\n  <packageSources>\n    <clear />\n    <add key="retrocore" value="." />\n  </packageSources>\n</configuration>\n' > artifacts/tool-package/nuget.config
          dotnet tool install retrocore --version 0.1.0-dev --tool-path artifacts/tool --configfile artifacts/tool-package/nuget.config
          RETROCORE_DAP_HOST="$PWD/artifacts/tool/retrocore" node tools/Test-ProjectDap.mjs

      - name: Extension tests
        working-directory: Retrocore/extension
        run: |
          npm ci
          # Check the committed grammars before compile regenerates them, so a
          # stale grammar (an *Isa.txt or keyword change not regenerated) fails.
          npm run check:grammar
          npm run compile
          npm run test:grammar

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ github.workspace }}/test-results
          if-no-files-found: ignore

  editor-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # An empty cache folder, so no test finds external files on the runner by accident.
      RETROCORE_CACHE: ${{ github.workspace }}/cache
    defaults:
      run:
        working-directory: Retrocore
    steps:
      - name: Check out Retrocore
        uses: actions/checkout@v7
        with:
          path: Retrocore

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: Retrocore/global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Retrocore/extension/package-lock.json

      - name: Install xvfb and VS Code's libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libgtk-3-0t64 libgbm1 libasound2t64 libxkbfile1 libsecret-1-0 libxss1 libdrm2 libnotify4

      # The language server and debug host the tests run, and the IIe sample they load.
      - name: Build
        run: |
          dotnet build Retrocore.slnx -c Release
          mkdir -p artifacts/iie-sample
          dotnet artifacts/AnyCPU/Release/Retrocore.Debug/net11.0/Retrocore.Debug.dll --assemble sample/iie/main.s artifacts/iie-sample/main.bin --dialect ca65 --config sample/iie/link.cfg

      - name: Cache VS Code
        uses: actions/cache@v5
        with:
          path: Retrocore/extension/.vscode-test
          key: vscode-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Retrocore/extension/src/test/runTest.ts') }}

      - name: Editor tests
        working-directory: Retrocore/extension
        run: |
          npm ci
          npm run compile
          # The whole suite, which includes the language-only steps, and the memory step again on its own, as it
          # runs first there, before anything else has opened an editor.
          xvfb-run -a npm run test:editor
          xvfb-run -a npm run test:memory-integration

      - name: Upload VS Code logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vscode-logs
          path: Retrocore/artifacts/vscode-m1-tests/profile/logs
          if-no-files-found: ignore
