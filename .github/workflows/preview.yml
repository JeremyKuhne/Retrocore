# Preview builds of the retrocore .NET tool and the VS Code extension, from main or by hand, kept as this workflow's
# artifacts and published to no feed, release or marketplace. The tool is versioned 0.1.0-preview.<run>, and the
# extension packages a host of that same version (the extension's own version stays package.json's), so a repository
# that pins the preview's tool and the preview's extension agree. To use them, download the run's artifacts:
# `dotnet tool restore --add-source <the folder holding retrocore.*.nupkg>` in a repository that pins that version,
# and `code --install-extension retrocore-*.vsix --force` (--force, as every preview has the same extension version).
# No run cancels another, so every run that passes its checks keeps its preview; both jobs build the host from the run's
# commit.

name: Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  VERSION_SUFFIX: preview.${{ github.run_number }}

jobs:
  tool:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The package, then a check that it installs from its folder alone, says its version, and makes a project.
      - name: Pack the tool
        run: |
          dotnet pack src/Retrocore.Debug/Retrocore.Debug.csproj -c Release -p:VersionSuffix="$VERSION_SUFFIX" -o "$RUNNER_TEMP/tool-package"
          version="0.1.0-$VERSION_SUFFIX"
          test -f "$RUNNER_TEMP/tool-package/retrocore.$version.nupkg"
          unzip -l "$RUNNER_TEMP/tool-package/retrocore.$version.nupkg" | grep -qF tools/net11.0/any/Schemas/project-1.schema.json
          unzip -l "$RUNNER_TEMP/tool-package/retrocore.$version.nupkg" | grep -qF tools/net11.0/any/Sdk/1/templates/6502/template.json
          printf '<configuration>\n  <packageSources>\n    <clear />\n    <add key="retrocore" value="%s" />\n  </packageSources>\n</configuration>\n' "$RUNNER_TEMP/tool-package" > "$RUNNER_TEMP/nuget.config"
          dotnet tool install retrocore --version "$version" --tool-path "$RUNNER_TEMP/tool" --configfile "$RUNNER_TEMP/nuget.config"
          test "$("$RUNNER_TEMP/tool/retrocore" --version)" = "$version"
          "$RUNNER_TEMP/tool/retrocore" new 6502 starter --output "$RUNNER_TEMP/starter"
          grep -qF "\"version\": \"$version\"" "$RUNNER_TEMP/starter/.config/dotnet-tools.json"

      - name: Keep the tool's package
        uses: actions/upload-artifact@v7
        with:
          name: retrocore-tool-0.1.0-${{ env.VERSION_SUFFIX }}
          path: ${{ runner.temp }}/tool-package/retrocore.*.nupkg
          if-no-files-found: error
          overwrite: true

  extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json

      # As tools/Install-Extension.ps1 packages it: the compiled extension, and the host it runs in server/, of the
      # preview tool's version, framework-dependent (it needs the .NET 11 runtime).
      - name: Package the extension
        run: |
          dotnet publish src/Retrocore.Debug/Retrocore.Debug.csproj -c Release -p:VersionSuffix="$VERSION_SUFFIX" -o extension/server -warnaserror
          cp LICENSE extension/LICENSE
          cd extension
          npm ci
          npm run compile
          # vsce writes into a folder that is there; it makes none.
          mkdir -p "$RUNNER_TEMP/vsix"
          npx vsce package --out "$RUNNER_TEMP/vsix/retrocore-preview.${{ github.run_number }}.vsix" --allow-missing-repository --no-rewrite-relative-links
          test "$(dotnet server/Retrocore.Debug.dll --version)" = "0.1.0-$VERSION_SUFFIX"
          unzip -l "$RUNNER_TEMP"/vsix/*.vsix | grep -qF extension/server/Retrocore.Debug.dll
          unzip -l "$RUNNER_TEMP"/vsix/*.vsix | grep -qF extension/server/Sdk/1/templates/6502/template.json

      - name: Keep the extension's package
        uses: actions/upload-artifact@v7
        with:
          name: retrocore-extension-preview.${{ github.run_number }}
          path: ${{ runner.temp }}/vsix/*.vsix
          if-no-files-found: error
          overwrite: true
