# Checks, when started by hand, that a repository that develops with Retrocore builds from a fresh clone on each
# system the tool runs on: the host packed as the retrocore tool, then a project retrocore new makes and the adventure
# sample's files alone, each committed, cloned, restored with dotnet tool restore (the tool from the local pack) and
# built with dotnet retrocore build --all (tools/Test-FreshClone.mjs). Run it from the Actions tab, or with
# `gh workflow run fresh-clone.yml --ref <branch>`, after a change to the templates, the tool's packaging or the sample.

name: Fresh clone

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  fresh-clone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: Retrocore
    steps:
      - name: Check out Retrocore
        uses: actions/checkout@v7
        with:
          path: Retrocore

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: Retrocore/global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build the tool
        run: dotnet build src/Retrocore.Debug/Retrocore.Debug.csproj -c Release

      - name: Fresh clones
        run: node tools/Test-FreshClone.mjs
